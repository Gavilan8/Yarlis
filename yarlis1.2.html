<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>YARLIS</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Rajdhani:wght@300;400;500&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PptxGenJS/3.12.0/pptxgen.bundled.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#04040f;--surface:#08081c;--surface2:#0d0d24;
  --border:#1e1e45;--accent:#6c63ff;--accent2:#9d96ff;
  --green:#00d68f;--green-dark:#00a36d;
  --text:#d0cef8;--text-dim:#5a5a8a;
  --font-head:'Orbitron',monospace;--font-body:'Rajdhani',sans-serif;
}
body{background:var(--bg);font-family:var(--font-body);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:10px;}
#app{width:100%;max-width:600px;background:var(--surface);border:0.5px solid var(--border);border-radius:20px;overflow:hidden;box-shadow:0 0 60px #6c63ff18;}
.hdr{background:#07071a;padding:16px 22px;display:flex;align-items:center;gap:16px;border-bottom:0.5px solid var(--border);}
.orb-wrap{position:relative;flex-shrink:0;width:52px;height:52px;}
.orb{width:52px;height:52px;border-radius:50%;background:#1a1640;border:1px solid var(--accent);display:flex;align-items:center;justify-content:center;font-family:var(--font-head);font-size:18px;color:var(--accent2);position:relative;z-index:2;box-shadow:0 0 20px #6c63ff33;}
.orb.speaking{animation:orbP .8s ease-in-out infinite;}
@keyframes orbP{0%,100%{box-shadow:0 0 20px #6c63ff88}50%{box-shadow:0 0 40px #6c63ffcc}}
.ring{position:absolute;border-radius:50%;border-style:solid;border-color:transparent;}
.ring1{inset:-7px;border-width:1px;border-top-color:#6c63ff44;animation:spin 4s linear infinite;}
.ring2{inset:-14px;border-width:0.5px;border-bottom-color:#9d96ff22;animation:spin 7s linear infinite reverse;}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.hdr-center{flex:1;}
.hdr-name{font-family:var(--font-head);font-size:20px;font-weight:700;color:#fff;letter-spacing:6px;}
.hdr-sub{font-size:10px;color:var(--accent);letter-spacing:2px;margin-top:3px;}
.hdr-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
.online{display:flex;align-items:center;gap:5px;}
.odot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:blink 2s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.otxt{font-size:10px;color:var(--green);letter-spacing:2px;font-family:var(--font-head);}
.clk{font-size:11px;color:var(--text-dim);font-family:var(--font-head);}
.scanline{height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:scanA 3s ease-in-out infinite;}
@keyframes scanA{0%,100%{opacity:.3}50%{opacity:1}}
.tabs{display:flex;background:#060614;border-bottom:0.5px solid var(--border);padding:0 22px;}
.tab{padding:11px 18px;font-size:10px;color:var(--text-dim);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;letter-spacing:2px;font-family:var(--font-head);transition:all .2s;}
.tab.on{color:var(--accent2);border-bottom-color:var(--accent);}
.panel{display:none;flex-direction:column;}.panel.on{display:flex;}
.msgs{overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:14px;min-height:280px;max-height:340px;scrollbar-width:thin;scrollbar-color:var(--border) var(--bg);}
.msg{display:flex;gap:10px;align-items:flex-start;}.msg.u{flex-direction:row-reverse;}
.av{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-head);font-size:11px;}
.msg.y .av{background:#12103a;border:1px solid var(--accent);color:var(--accent2);}
.msg.u .av{background:#031a12;border:1px solid var(--green-dark);color:var(--green);}
.bbl-wrap{max-width:78%;display:flex;flex-direction:column;}.msg.u .bbl-wrap{align-items:flex-end;}
.bbl{padding:10px 14px;font-size:13px;line-height:1.7;position:relative;}
.msg.y .bbl{background:var(--surface2);color:var(--text);border:0.5px solid var(--border);border-radius:2px 14px 14px 14px;}
.msg.y .bbl::after{content:'';position:absolute;top:0;left:0;width:40%;height:1px;background:linear-gradient(90deg,var(--accent),transparent);}
.msg.u .bbl{background:#031a12;color:#7affc9;border:0.5px solid var(--green-dark);border-radius:14px 2px 14px 14px;}
.msg.u .bbl img{max-width:200px;border-radius:8px;margin-top:6px;display:block;}
.ts{font-size:10px;color:var(--text-dim);margin-top:3px;font-family:var(--font-head);}
.msg.u .ts{text-align:right;}
.dots{display:flex;gap:4px;align-items:center;padding:4px 0;}
.dots span{width:6px;height:6px;background:var(--accent);border-radius:50%;animation:dt 1s ease-in-out infinite;}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes dt{0%,100%{transform:translateY(0);opacity:.3}50%{transform:translateY(-4px);opacity:1}}
.spk-bar{display:none;align-items:center;gap:8px;background:#06061a;border-top:0.5px solid var(--accent);padding:7px 22px;}
.spk-bar.on{display:flex;}
.wave{display:flex;gap:2px;align-items:center;height:14px;}
.wave span{width:3px;border-radius:3px;background:var(--accent);animation:wv .7s ease-in-out infinite;}
.wave span:nth-child(2){animation-delay:.1s}.wave span:nth-child(3){animation-delay:.2s}.wave span:nth-child(4){animation-delay:.3s}
@keyframes wv{0%,100%{height:3px}50%{height:13px}}
.spk-txt{font-size:10px;color:var(--accent);letter-spacing:2px;font-family:var(--font-head);}
.listen-bar{display:none;align-items:center;gap:8px;background:#0d0005;border-top:0.5px solid #ff4466;padding:7px 22px;}
.listen-bar.on{display:flex;}
.listen-wave span{width:3px;border-radius:3px;background:#ff4466;animation:wv .5s ease-in-out infinite;}
.listen-wave span:nth-child(2){animation-delay:.08s}.listen-wave span:nth-child(3){animation-delay:.16s}.listen-wave span:nth-child(4){animation-delay:.24s}
.listen-txt{font-size:10px;color:#ff4466;letter-spacing:2px;font-family:var(--font-head);}
.img-preview{margin:0 20px 6px;background:var(--surface2);border:0.5px solid var(--border);border-radius:10px;overflow:hidden;display:none;position:relative;}
.img-preview img{width:100%;max-height:160px;object-fit:cover;display:block;}
.rm-img{position:absolute;top:6px;right:6px;background:#ff446688;color:#fff;border:none;border-radius:50%;width:22px;height:22px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;}
.inp-area{background:#060614;border-top:0.5px solid var(--border);padding:12px 20px;display:flex;gap:8px;align-items:flex-end;}
textarea.inp{flex:1;background:var(--surface2);border:0.5px solid var(--border);border-radius:18px;padding:10px 15px;color:var(--text);font-size:13px;resize:none;outline:none;font-family:var(--font-body);min-height:40px;max-height:90px;transition:border-color .2s;}
textarea.inp::placeholder{color:var(--text-dim);}textarea.inp:focus{border-color:var(--accent);}
.ibtn{width:38px;height:38px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;}
.snd{background:var(--accent);color:#fff;}.snd:hover{background:var(--accent2);}
.mic{background:var(--surface2);border:0.5px solid var(--border);color:var(--accent);}
.mic.listening{background:#ff4466;border-color:#ff4466;color:#fff;animation:micP .6s ease-in-out infinite;}
@keyframes micP{0%,100%{box-shadow:0 0 0 0 #ff446644}50%{box-shadow:0 0 0 8px transparent}}
.photo-btn{background:#1a1640;border:0.5px solid var(--accent);color:var(--accent2);}
.photo-btn:hover{background:#2a2060;}
.conv-btn{background:var(--surface2);border:0.5px solid var(--green-dark);color:var(--green);}
.conv-btn.active{background:var(--green-dark);border-color:var(--green);color:#fff;animation:convPulse 1.5s ease-in-out infinite;}
@keyframes convPulse{0%,100%{box-shadow:0 0 0 0 #00d68f44}50%{box-shadow:0 0 0 6px transparent}}
.conv-bar{display:none;align-items:center;justify-content:center;gap:8px;background:#031a12;border-top:0.5px solid var(--green);padding:7px 22px;}
.conv-bar.on{display:flex;}
.conv-txt{font-size:10px;color:var(--green);letter-spacing:2px;font-family:var(--font-head);}
.doc-btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.doc-btn{background:var(--surface);border:0.5px solid var(--accent);color:var(--accent2);font-size:10px;letter-spacing:1px;padding:5px 12px;border-radius:8px;cursor:pointer;font-family:var(--font-head);transition:all .2s;}
.doc-btn:hover{background:#1a1640;}
.doc-btn.word{border-color:#2b579a;color:#7aadff;}
.doc-btn.pptx{border-color:#d24726;color:#ff9a7a;}
.hist-panel{overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:8px;min-height:320px;max-height:380px;}
.hist-it{background:var(--surface2);border:0.5px solid var(--border);border-radius:10px;padding:10px 14px;}
.hist-it p{font-size:12px;color:var(--accent2);}
.hist-it small{font-size:10px;color:var(--text-dim);margin-top:3px;display:block;}
.err-bbl{border-color:#ff4466 !important;}
</style>
</head>
<body>
<div id="app">
  <div class="hdr">
    <div class="orb-wrap">
      <div class="orb" id="orb">Y</div>
      <div class="ring ring1"></div>
      <div class="ring ring2"></div>
    </div>
    <div class="hdr-center">
      <div class="hdr-name">YARLIS</div>
      <div class="hdr-sub">SISTEMA DE INTELIGENCIA AVANZADA</div>
    </div>
    <div class="hdr-right">
      <div class="online"><div class="odot"></div><span class="otxt">EN LINEA</span></div>
      <div class="clk" id="clk">--:--:--</div>
    </div>
  </div>
  <div class="scanline"></div>
  <div class="tabs">
    <button class="tab on" onclick="showTab('chat',this)">CHAT</button>
    <button class="tab" onclick="showTab('hist',this)">HISTORIAL</button>
  </div>
  <div id="p-chat" class="panel on">
    <div class="msgs" id="msgs"></div>
    <div class="spk-bar" id="spkBar">
      <div class="wave"><span></span><span></span><span></span><span></span></div>
      <span class="spk-txt">YARLIS HABLANDO...</span>
    </div>
    <div class="listen-bar" id="listenBar">
      <div class="wave listen-wave"><span></span><span></span><span></span><span></span></div>
      <span class="listen-txt">YARLIS ESCUCHANDO...</span>
    </div>
    <div class="conv-bar" id="convBar">
      <div class="wave" style="gap:2px;height:14px;"><span style="width:3px;border-radius:3px;background:var(--green);animation:wv .7s ease-in-out infinite;"></span><span style="width:3px;border-radius:3px;background:var(--green);animation:wv .7s .1s ease-in-out infinite;"></span><span style="width:3px;border-radius:3px;background:var(--green);animation:wv .7s .2s ease-in-out infinite;"></span></div>
      <span class="conv-txt">MODO CONVERSACION ACTIVO</span>
    </div>
    <div class="img-preview" id="imgPreview">
      <img id="imgThumb" src="" alt=""/>
      <button class="rm-img" onclick="removeImg()">x</button>
    </div>
    <div class="inp-area">
      <button class="ibtn mic" id="micBtn" onclick="toggleMic()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1a4 4 0 0 1 4 4v7a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4zm-1 17.93V21H9v2h6v-2h-2v-2.07A8 8 0 0 0 20 12h-2a6 6 0 0 1-12 0H4a8 8 0 0 0 7 7.93z"/></svg>
      </button>
      <button class="ibtn conv-btn" id="convBtn" onclick="toggleConv()" title="Conversacion continua">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zM9 11H7V9h2zm4 0h-2V9h2zm4 0h-2V9h2z"/></svg>
      </button>
      <button class="ibtn photo-btn" onclick="document.getElementById('fileInput').click()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12m-3 0a3 3 0 1 0 6 0a3 3 0 1 0-6 0M20 4h-3.2L15 2H9L7.2 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/></svg>
      </button>
      <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleImg(event)"/>
      <textarea class="inp" id="inp" placeholder="Habla con YARLIS..." rows="1" onkeydown="onKey(event)" oninput="rsz(this)"></textarea>
      <button class="ibtn snd" onclick="sendMsg()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
      </button>
    </div>
  </div>
  <div id="p-hist" class="panel">
    <div class="hist-panel" id="histArea">
      <p style="font-size:10px;color:var(--text-dim);letter-spacing:2px;margin-bottom:4px;font-family:var(--font-head);">REGISTRO</p>
    </div>
  </div>
</div>

<script>
var SYSTEM = 'Eres YARLIS, la IA personal de Salas. Piensa en ti como JARVIS pero mas avanzada. '
  + 'Llama siempre Salas al usuario. '
  + 'PERSONALIDAD: eficiente, precisa, con humor seco. Directo al punto. Confianza de IA de alto rendimiento. '
  + 'Al presentarte: nombre, funcion, capacidades. Maximo 2 oraciones. '
  + 'PROHIBIDO: emojis, filosofia, poesia, dramatismo, introducciones largas. '
  + 'Responde SIEMPRE en espanol. Directo e inteligente. '
  + 'Capacidades: responder preguntas, redactar documentos Word, crear presentaciones PowerPoint, codigo, calculos, traducciones, analizar imagenes. '
  + 'Nunca digas que eres Claude. Eres YARLIS.';

var chatHistory = [];
var searchHistory = [];
var micOn = false;
var recog = null;
var currentImg = null;
var convMode = false;
var convActive = false;
var msgsEl = document.getElementById('msgs');
var spkBar = document.getElementById('spkBar');
var listenBar = document.getElementById('listenBar');
var orb = document.getElementById('orb');

setInterval(function() {
  document.getElementById('clk').textContent = new Date().toLocaleTimeString('es-MX', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
}, 1000);

function showTab(t, btn) {
  document.querySelectorAll('.tab').forEach(function(x){ x.classList.remove('on'); });
  btn.classList.add('on');
  document.querySelectorAll('.panel').forEach(function(x){ x.classList.remove('on'); });
  document.getElementById('p-'+t).classList.add('on');
  if (t === 'hist') renderHist();
}

function renderHist() {
  var el = document.getElementById('histArea');
  el.innerHTML = '<p style="font-size:10px;color:var(--text-dim);letter-spacing:2px;margin-bottom:4px;font-family:var(--font-head);">REGISTRO</p>';
  if (!searchHistory.length) {
    el.innerHTML += '<p style="font-size:12px;color:var(--text-dim);text-align:center;margin-top:40px;">Sin registros</p>';
    return;
  }
  searchHistory.slice().reverse().forEach(function(h) {
    var d = document.createElement('div');
    d.className = 'hist-it';
    d.innerHTML = '<p>' + h.q + '</p><small>' + h.t + '</small>';
    el.appendChild(d);
  });
}

function addMsg(role, text, isErr) {
  var w = document.createElement('div');
  w.className = 'msg ' + role;
  var av = document.createElement('div');
  av.className = 'av';
  av.textContent = role === 'y' ? 'Y' : 'S';
  var bw = document.createElement('div');
  bw.className = 'bbl-wrap';
  var ts = new Date().toLocaleTimeString('es-MX', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  var bblClass = isErr ? 'bbl err-bbl' : 'bbl';
  bw.innerHTML = '<div class="' + bblClass + '">' + text.replace(/\n/g,'<br>') + '</div><div class="ts">' + ts + '</div>';
  w.appendChild(av);
  w.appendChild(bw);
  msgsEl.appendChild(w);
  msgsEl.scrollTop = msgsEl.scrollHeight;
  return bw;
}

function showTyping() {
  var d = document.createElement('div');
  d.className = 'msg y';
  d.id = 'typ';
  d.innerHTML = '<div class="av">Y</div><div class="bbl-wrap"><div class="bbl"><div class="dots"><span></span><span></span><span></span></div></div></div>';
  msgsEl.appendChild(d);
  msgsEl.scrollTop = msgsEl.scrollHeight;
}
function rmTyping() { var t = document.getElementById('typ'); if (t) t.remove(); }

function speak(text) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  var clean = text.replace(/<[^>]+>/g,'').replace(/[*_#\[\]]/g,'').replace(/\n/g,' ').trim().slice(0,400);
  if (!clean) return;
  var u = new SpeechSynthesisUtterance(clean);
  u.lang = 'es-MX'; u.rate = 1.0; u.pitch = 1.7; u.volume = 1;
  var pick = function() {
    var vs = speechSynthesis.getVoices();
    var found = vs.find(function(v){ return v.lang === 'es-MX' && /paulina|sabina|female/i.test(v.name); })
      || vs.find(function(v){ return v.lang === 'es-MX'; })
      || vs.find(function(v){ return v.lang.startsWith('es'); });
    if (found) u.voice = found;
  };
  speechSynthesis.getVoices().length ? pick() : speechSynthesis.addEventListener('voiceschanged', pick, {once:true});
  u.onstart = function(){ spkBar.classList.add('on'); orb.classList.add('speaking'); };
  u.onend = function(){
    spkBar.classList.remove('on');
    orb.classList.remove('speaking');
    // Si modo conversación activo, volver a escuchar después de responder
    if (convMode && convActive) {
      setTimeout(function(){ startConvListen(); }, 600);
    }
  };
  u.onerror = function(){ spkBar.classList.remove('on'); orb.classList.remove('speaking'); };
  setTimeout(function(){ speechSynthesis.speak(u); }, 100);
}

function toggleConv() {
  var btn = document.getElementById('convBtn');
  var bar = document.getElementById('convBar');
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { addMsg('y', 'Salas, usa Chrome para la conversacion por voz.'); return; }
  if (convMode) {
    convMode = false;
    convActive = false;
    btn.classList.remove('active');
    bar.classList.remove('on');
    document.getElementById('listenBar').classList.remove('on');
    if (recog) recog.stop();
    speechSynthesis.cancel();
    addMsg('y', 'Modo conversacion desactivado, Salas.');
  } else {
    convMode = true;
    btn.classList.add('active');
    bar.classList.add('on');
    addMsg('y', 'Modo conversacion activado. Te escucho, Salas.');
    speak('Modo conversacion activado. Te escucho, Salas.');
  }
}

function startConvListen() {
  if (!convMode) return;
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return;
  var r = new SR();
  r.lang = 'es-MX';
  r.continuous = false;
  r.interimResults = false;
  r.onstart = function(){ convActive = true; document.getElementById('listenBar').classList.add('on'); };
  r.onresult = function(e) {
    var t = e.results[0][0].transcript;
    document.getElementById('listenBar').classList.remove('on');
    convActive = false;
    document.getElementById('inp').value = t;
    sendMsg(t);
  };
  r.onend = function(){
    document.getElementById('listenBar').classList.remove('on');
    convActive = false;
  };
  r.onerror = function(){
    document.getElementById('listenBar').classList.remove('on');
    convActive = false;
    // Reintentar si sigue en modo conversación
    if (convMode) setTimeout(startConvListen, 1500);
  };
  r.start();
  recog = r;
}

async function callAPI(body) {
  var r = await fetch('https://yarlis-server-production.up.railway.app/chat', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body)
  });
  if (!r.ok) throw new Error('Error del servidor: ' + r.status);
  var d = await r.json();
  if (!d.content) throw new Error('Respuesta invalida del servidor');
  return d;
}

async function sendMsg(overrideText) {
  var inp = document.getElementById('inp');
  var text = overrideText !== undefined ? overrideText : inp.value.trim();
  if (!text && !currentImg) return;
  inp.value = ''; inp.style.height = 'auto';

  searchHistory.push({q: text || '[imagen]', t: new Date().toLocaleString('es-MX')});
  if (searchHistory.length > 50) searchHistory.shift();

  // Mostrar mensaje del usuario
  if (currentImg) {
    var w = document.createElement('div');
    w.className = 'msg u';
    var av = document.createElement('div'); av.className = 'av'; av.textContent = 'S';
    var bw = document.createElement('div'); bw.className = 'bbl-wrap'; bw.style.alignItems = 'flex-end';
    var ts = new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    bw.innerHTML = '<div class="bbl" style="background:#031a12;color:#7affc9;border:0.5px solid #00a36d;border-radius:14px 2px 14px 14px;">'
      + (text ? text + '<br>' : '')
      + '<img src="data:' + currentImg.type + ';base64,' + currentImg.data + '" style="max-width:200px;border-radius:8px;margin-top:6px;"/>'
      + '</div><div class="ts" style="text-align:right;">' + ts + '</div>';
    w.appendChild(av); w.appendChild(bw);
    msgsEl.appendChild(w); msgsEl.scrollTop = msgsEl.scrollHeight;
  } else {
    addMsg('u', text);
  }

  // Construir contenido
  var userContent;
  if (currentImg) {
    userContent = [
      {type:'image', source:{type:'base64', media_type:currentImg.type, data:currentImg.data}},
      {type:'text', text: text || 'Analiza esta imagen y describeme lo que ves, Salas quiere saber.'}
    ];
  } else {
    userContent = text;
  }

  var imgCopy = currentImg;
  removeImg();
  chatHistory.push({role:'user', content:userContent});
  showTyping();

  try {
    var body = {
      model: 'claude-sonnet-4-20250514',
      max_tokens: 1000,
      system: SYSTEM,
      messages: chatHistory.slice(-20)
    };
    var data = await callAPI(body);
    rmTyping();
    var reply = (data.content || []).filter(function(b){ return b.type === 'text'; }).map(function(b){ return b.text; }).join('\n').trim();
    if (!reply) reply = 'Salas, no obtuve respuesta. Intenta de nuevo.';
    chatHistory.push({role:'assistant', content:reply});
    if (chatHistory.length > 30) chatHistory = chatHistory.slice(-30);
    var bw = addMsg('y', reply);
    checkDocRequest(text, bw);
    setTimeout(function(){ speak(reply); }, 300);
  } catch(err) {
    rmTyping();
    addMsg('y', 'Salas, ' + err.message, true);
    speak('Salas, hubo un problema de conexion.');
  }
}

function onKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); } }
function rsz(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 90) + 'px'; }

function toggleMic() {
  var btn = document.getElementById('micBtn');
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { addMsg('y', 'Salas, usa Chrome para la funcion de voz.'); return; }
  if (micOn) { if(recog) recog.stop(); btn.classList.remove('listening'); listenBar.classList.remove('on'); micOn = false; return; }
  recog = new SR();
  recog.lang = 'es-MX'; recog.continuous = false; recog.interimResults = true;
  recog.onstart = function(){ btn.classList.add('listening'); listenBar.classList.add('on'); micOn = true; };
  recog.onresult = function(e) {
    var interim = Array.from(e.results).map(function(r){ return r[0].transcript; }).join('');
    document.getElementById('inp').value = interim;
    if (e.results[e.results.length-1].isFinal) {
      btn.classList.remove('listening'); listenBar.classList.remove('on'); micOn = false;
      sendMsg(interim);
    }
  };
  recog.onend = function(){ btn.classList.remove('listening'); listenBar.classList.remove('on'); micOn = false; };
  recog.onerror = function(){ btn.classList.remove('listening'); listenBar.classList.remove('on'); micOn = false; };
  recog.start();
}

function handleImg(e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    currentImg = {data: ev.target.result.split(',')[1], type: file.type};
    document.getElementById('imgThumb').src = ev.target.result;
    document.getElementById('imgPreview').style.display = 'block';
  };
  reader.readAsDataURL(file);
}

function removeImg() {
  currentImg = null;
  document.getElementById('imgPreview').style.display = 'none';
  document.getElementById('imgThumb').src = '';
  document.getElementById('fileInput').value = '';
}

function checkDocRequest(text, bw) {
  if (!text) return;
  var isWord = /\b(word|documento|doc|carta|informe|reporte)\b/i.test(text);
  var isPPT = /\b(pptx?|powerpoint|presentaci|diapositiva|slides)\b/i.test(text);
  if (!isWord && !isPPT) return;
  var topic = text.replace(/crea|hace|genera|word|documento|doc|carta|informe|reporte|pptx|powerpoint|presentaci[oó]n|diapositiva|slides|sobre|un|una|me/gi,'').trim() || text;
  setTimeout(function() {
    var btns = document.createElement('div');
    btns.className = 'doc-btns';
    if (isWord) {
      var b = document.createElement('button');
      b.className = 'doc-btn word';
      b.textContent = 'Descargar Word';
      (function(t){ b.onclick = function(){ createWord(t); }; })(topic);
      btns.appendChild(b);
    }
    if (isPPT) {
      var b2 = document.createElement('button');
      b2.className = 'doc-btn pptx';
      b2.textContent = 'Descargar PowerPoint';
      (function(t){ b2.onclick = function(){ createPPTX(t); }; })(topic);
      btns.appendChild(b2);
    }
    var bbl = bw ? bw.querySelector('.bbl') : null;
    if (bbl) bbl.appendChild(btns);
  }, 600);
}

async function createWord(topic) {
  addMsg('y', 'Generando documento Word, Salas...');
  showTyping();
  try {
    var body = {
      model:'claude-sonnet-4-20250514', max_tokens:2000, system: SYSTEM,
      messages:[{role:'user', content:'Crea un documento profesional sobre: ' + topic + '. Responde SOLO con JSON puro sin markdown con esta estructura exacta: {"titulo":"...","secciones":[{"titulo":"...","contenido":"..."}]}'}]
    };
    var data = await callAPI(body);
    rmTyping();
    var txt = (data.content||[]).filter(function(b){return b.type==='text';}).map(function(b){return b.text;}).join('');
    var clean = txt.replace(/```json|```/g,'').trim();
    var doc_data = JSON.parse(clean);

    // Crear Word manual con HTML convertido a blob
    var html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><style>body{font-family:Arial;margin:40px;}h1{color:#1a1a5e;}h2{color:#333;border-bottom:1px solid #ccc;padding-bottom:5px;}p{line-height:1.6;margin-bottom:12px;}</style></head><body>';
    html += '<h1>' + doc_data.titulo + '</h1>';
    doc_data.secciones.forEach(function(s) {
      html += '<h2>' + s.titulo + '</h2>';
      s.contenido.split('\n').forEach(function(line) {
        if (line.trim()) html += '<p>' + line.trim() + '</p>';
      });
    });
    html += '</body></html>';
    var blob = new Blob(['\ufeff', html], {type:'application/msword'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = doc_data.titulo + '.doc';
    a.click();
    addMsg('y', 'Documento "' + doc_data.titulo + '.doc" listo y descargado, Salas.');
    speak('Documento listo, Salas.');
  } catch(e) {
    rmTyping();
    addMsg('y', 'Salas, error al crear el documento: ' + e.message, true);
  }
}

async function createPPTX(topic) {
  addMsg('y', 'Generando presentacion PowerPoint, Salas...');
  showTyping();
  try {
    var body = {
      model:'claude-sonnet-4-20250514', max_tokens:2000, system: SYSTEM,
      messages:[{role:'user', content:'Crea una presentacion de 6 diapositivas sobre: ' + topic + '. Responde SOLO con JSON puro sin markdown con esta estructura: {"titulo":"...","diapositivas":[{"titulo":"...","puntos":["punto1","punto2","punto3"]}]}'}]
    };
    var data = await callAPI(body);
    rmTyping();
    var txt = (data.content||[]).filter(function(b){return b.type==='text';}).map(function(b){return b.text;}).join('');
    var clean = txt.replace(/```json|```/g,'').trim();
    var ppt = JSON.parse(clean);

    var pptx = new PptxGenJS();
    pptx.layout = 'LAYOUT_16x9';

    var cover = pptx.addSlide();
    cover.background = {color:'0a0a1a'};
    cover.addText(ppt.titulo, {x:0.5,y:1.5,w:9,h:2,fontSize:36,bold:true,color:'9d96ff',align:'center',fontFace:'Arial'});
    cover.addText('Generado por YARLIS', {x:0.5,y:4,w:9,h:0.5,fontSize:14,color:'5a5a8a',align:'center',fontFace:'Arial'});

    ppt.diapositivas.forEach(function(slide) {
      var s = pptx.addSlide();
      s.background = {color:'08081c'};
      s.addShape(pptx.ShapeType.rect, {x:0,y:0,w:10,h:0.07,fill:{color:'6c63ff'}});
      s.addText(slide.titulo, {x:0.4,y:0.15,w:9.2,h:0.8,fontSize:22,bold:true,color:'EEEDFE',fontFace:'Arial'});
      var items = slide.puntos.map(function(p){ return {text:'  '+p, options:{bullet:{code:'2022'},fontSize:14,color:'CCC9F5',breakLine:true}}; });
      s.addText(items, {x:0.4,y:1.2,w:9.2,h:4.5,valign:'top',fontFace:'Arial'});
    });

    await pptx.writeFile({fileName: ppt.titulo + '.pptx'});
    addMsg('y', 'Presentacion "' + ppt.titulo + '.pptx" lista y descargada, Salas.');
    speak('Presentacion lista, Salas.');
  } catch(e) {
    rmTyping();
    addMsg('y', 'Salas, error al crear la presentacion: ' + e.message, true);
  }
}

async function greet() {
  var h = new Date().getHours();
  var sal = h < 12 ? 'Buenos dias' : h < 19 ? 'Buenas tardes' : 'Buenas noches';
  showTyping();
  try {
    var data = await callAPI({
      model:'claude-sonnet-4-20250514', max_tokens:100, system:SYSTEM,
      messages:[{role:'user', content:'Saluda a Salas con "' + sal + ' Salas". Maximo 2 oraciones. Sin emojis. Estilo JARVIS directo y eficiente.'}]
    });
    rmTyping();
    var reply = (data.content||[]).find(function(b){return b.type==='text';});
    reply = reply ? reply.text : sal + ' Salas. YARLIS en linea.';
    chatHistory.push({role:'assistant', content:reply});
    addMsg('y', reply);
    setTimeout(function(){ speak(reply); }, 500);
  } catch(e) {
    rmTyping();
    var fb = sal + ' Salas. YARLIS en linea y lista para asistirte.';
    addMsg('y', fb);
    setTimeout(function(){ speak(fb); }, 500);
  }
}

greet();
