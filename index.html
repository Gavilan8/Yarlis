<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>YARLIS — Asistente IA Personal</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Rajdhani:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#04040f;
  --surface:#08081c;
  --surface2:#0d0d24;
  --border:#1e1e45;
  --accent:#6c63ff;
  --accent2:#9d96ff;
  --accent-glow:#6c63ff44;
  --green:#00d68f;
  --green-dark:#00a36d;
  --text:#d0cef8;
  --text-dim:#5a5a8a;
  --font-head:'Orbitron',monospace;
  --font-body:'Rajdhani',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);font-family:var(--font-body);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}

#app{
  width:100%;max-width:600px;
  background:var(--surface);
  border:0.5px solid var(--border);
  border-radius:20px;overflow:hidden;
  box-shadow:0 0 60px #6c63ff18, 0 0 120px #6c63ff08;
}

/* HEADER */
.hdr{
  background:linear-gradient(135deg,#07071a,#0b0b22);
  padding:18px 24px;
  display:flex;align-items:center;gap:18px;
  border-bottom:0.5px solid var(--border);
  position:relative;overflow:hidden;
}
.hdr::before{
  content:'';position:absolute;top:-40px;right:-40px;
  width:160px;height:160px;border-radius:50%;
  background:radial-gradient(circle,#6c63ff12,transparent 70%);
}
.orb-wrap{position:relative;flex-shrink:0;width:56px;height:56px;}
.orb{
  width:56px;height:56px;border-radius:50%;
  background:linear-gradient(135deg,#1a1650,#0d0d2a);
  border:1px solid var(--accent);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-head);font-size:20px;color:var(--accent2);
  position:relative;z-index:3;
  box-shadow:0 0 20px var(--accent-glow), inset 0 0 20px #6c63ff11;
}
.orb.speaking{box-shadow:0 0 30px #6c63ff88, inset 0 0 20px #6c63ff22;animation:orbPulse .8s ease-in-out infinite;}
@keyframes orbPulse{0%,100%{box-shadow:0 0 20px #6c63ff88}50%{box-shadow:0 0 40px #6c63ffcc}}
.ring{position:absolute;border-radius:50%;border-style:solid;border-color:transparent;}
.ring1{inset:-8px;border-width:1px;border-top-color:#6c63ff44;border-right-color:#6c63ff22;animation:spin 4s linear infinite;}
.ring2{inset:-16px;border-width:0.5px;border-bottom-color:#9d96ff22;border-left-color:#9d96ff11;animation:spin 7s linear infinite reverse;}
.ring3{inset:-24px;border-width:0.5px;border-top-color:#6c63ff11;animation:spin 12s linear infinite;}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

.hdr-center{flex:1;}
.hdr-name{font-family:var(--font-head);font-size:22px;font-weight:700;color:#fff;letter-spacing:6px;line-height:1;}
.hdr-sub{font-size:11px;color:var(--accent);letter-spacing:3px;margin-top:5px;font-weight:300;}
.hdr-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
.online-badge{display:flex;align-items:center;gap:6px;}
.online-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:blink 2s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.online-txt{font-size:10px;color:var(--green);letter-spacing:2px;font-family:var(--font-head);}
.clk{font-size:12px;color:var(--text-dim);font-family:var(--font-head);letter-spacing:1px;}

/* SCAN LINE */
.scanline{height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:scanAnim 3s ease-in-out infinite;}
@keyframes scanAnim{0%,100%{opacity:.3}50%{opacity:1}}

/* TABS */
.tabs{display:flex;background:#060614;border-bottom:0.5px solid var(--border);padding:0 24px;}
.tab{padding:12px 20px;font-size:10px;color:var(--text-dim);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;letter-spacing:3px;transition:all .2s;font-family:var(--font-head);}
.tab.on{color:var(--accent2);border-bottom-color:var(--accent);}
.tab:hover{color:var(--accent2);}

/* PANELS */
.panel{display:none;}.panel.on{display:flex;flex-direction:column;}

/* MESSAGES */
.msgs{
  overflow-y:auto;padding:20px 24px;
  display:flex;flex-direction:column;gap:16px;
  min-height:280px;max-height:320px;
  scrollbar-width:thin;scrollbar-color:var(--border) var(--bg);
}
.msg{display:flex;gap:12px;align-items:flex-start;}
.msg.u{flex-direction:row-reverse;}
.av{
  width:34px;height:34px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-head);font-size:11px;
}
.msg.y .av{background:#12103a;border:1px solid var(--accent);color:var(--accent2);}
.msg.u .av{background:#031a12;border:1px solid var(--green-dark);color:var(--green);}
.bbl-wrap{max-width:78%;display:flex;flex-direction:column;}
.msg.u .bbl-wrap{align-items:flex-end;}
.bbl{
  padding:11px 15px;font-size:14px;line-height:1.7;
  font-family:var(--font-body);font-weight:400;
  position:relative;
}
.msg.y .bbl{
  background:var(--surface2);color:var(--text);
  border:0.5px solid var(--border);
  border-radius:2px 14px 14px 14px;
}
.msg.y .bbl::after{content:'';position:absolute;top:0;left:0;width:40%;height:1px;background:linear-gradient(90deg,var(--accent),transparent);}
.msg.u .bbl{
  background:#031a12;color:#7affc9;
  border:0.5px solid var(--green-dark);
  border-radius:14px 2px 14px 14px;
}
.ts{font-size:10px;color:var(--text-dim);margin-top:4px;font-family:var(--font-head);letter-spacing:.5px;}
.msg.u .ts{text-align:right;}

/* TYPING */
.dots{display:flex;gap:5px;align-items:center;padding:5px 2px;}
.dots span{width:6px;height:6px;background:var(--accent);border-radius:50%;animation:dt 1s ease-in-out infinite;}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes dt{0%,100%{transform:translateY(0);opacity:.3}50%{transform:translateY(-5px);opacity:1}}

/* SPEAKING BAR */
.spk-bar{
  display:none;align-items:center;gap:10px;
  background:#06061a;border-top:0.5px solid var(--accent);
  padding:8px 24px;
}
.spk-bar.on{display:flex;}
.wave{display:flex;gap:3px;align-items:center;height:18px;}
.wave span{width:3px;border-radius:3px;background:var(--accent);animation:wv .6s ease-in-out infinite;}
.wave span:nth-child(1){animation-delay:0s}.wave span:nth-child(2){animation-delay:.08s;background:var(--accent2);}
.wave span:nth-child(3){animation-delay:.16s}.wave span:nth-child(4){animation-delay:.24s;background:var(--accent2);}
.wave span:nth-child(5){animation-delay:.32s}.wave span:nth-child(6){animation-delay:.4s;background:var(--accent2);}
@keyframes wv{0%,100%{height:3px}50%{height:17px}}
.spk-txt{font-size:10px;color:var(--accent);letter-spacing:3px;font-family:var(--font-head);}

/* INPUT */
.inp-area{
  background:#060614;border-top:0.5px solid var(--border);
  padding:16px 24px;display:flex;gap:12px;align-items:flex-end;
}
textarea.inp{
  flex:1;background:var(--surface2);border:0.5px solid var(--border);
  border-radius:16px;padding:11px 18px;color:var(--text);
  font-size:14px;resize:none;outline:none;
  font-family:var(--font-body);min-height:44px;max-height:100px;
  transition:border-color .2s;letter-spacing:.5px;
}
textarea.inp::placeholder{color:var(--text-dim);}
textarea.inp:focus{border-color:var(--accent);}
.ibtn{
  width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;
}
.snd{background:var(--accent);color:#fff;}
.snd:hover{background:var(--accent2);transform:scale(1.05);}
.mic{background:var(--surface2);border:0.5px solid var(--border);color:var(--accent);}
.mic:hover{border-color:var(--accent);}
.mic.on{background:var(--green-dark);border-color:var(--green);color:#fff;}

/* HIST */
.hist-panel{overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:10px;min-height:380px;max-height:420px;}
.hist-it{background:var(--surface2);border:0.5px solid var(--border);border-radius:12px;padding:12px 16px;transition:border-color .2s;}
.hist-it:hover{border-color:var(--accent);}
.hist-it p{font-size:13px;color:var(--accent2);font-family:var(--font-body);}
.hist-it small{font-size:10px;color:var(--text-dim);margin-top:4px;display:block;font-family:var(--font-head);}

/* ERROR */
.err-bbl{border-color:#ff4466 !important;}
.err-bbl::after{background:linear-gradient(90deg,#ff4466,transparent) !important;}
</style>
</head>
<body>
<div id="app">
  <div class="hdr">
    <div class="orb-wrap">
      <div class="orb" id="mainOrb">Y</div>
      <div class="ring ring1"></div>
      <div class="ring ring2"></div>
      <div class="ring ring3"></div>
    </div>
    <div class="hdr-center">
      <div class="hdr-name">YARLIS</div>
      <div class="hdr-sub">SISTEMA DE INTELIGENCIA AVANZADA</div>
    </div>
    <div class="hdr-right">
      <div class="online-badge"><div class="online-dot"></div><span class="online-txt">EN LÍNEA</span></div>
      <div class="clk" id="clk">--:--:--</div>
    </div>
  </div>

  <div class="scanline"></div>

  <div class="tabs">
    <button class="tab on" onclick="showTab('chat',this)">CHAT</button>
    <button class="tab" onclick="showTab('hist',this)">HISTORIAL</button>
  </div>

  <div id="p-chat" class="panel on">
    <div class="msgs" id="msgs"></div>
    <div class="spk-bar" id="spkBar">
      <div class="wave"><span></span><span></span><span></span><span></span><span></span><span></span></div>
      <span class="spk-txt">YARLIS HABLANDO...</span>
    </div>
    <div class="inp-area">
      <button class="ibtn mic" id="micBtn" onclick="toggleMic()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 1a4 4 0 0 1 4 4v7a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4zm-1 17.93V21H9v2h6v-2h-2v-2.07A8 8 0 0 0 20 12h-2a6 6 0 0 1-12 0H4a8 8 0 0 0 7 7.93z"/>
        </svg>
      </button>
      <textarea class="inp" id="inp" placeholder="Habla con YARLIS..." rows="1"
        onkeydown="onKey(event)" oninput="rsz(this)"></textarea>
      <button class="ibtn snd" onclick="go()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/>
        </svg>
      </button>
    </div>
  </div>

  <div id="p-hist" class="panel">
    <div class="hist-panel" id="histArea">
      <p style="font-size:10px;color:var(--text-dim);letter-spacing:3px;margin-bottom:4px;font-family:var(--font-head);">REGISTRO DE SESIÓN</p>
    </div>
  </div>
</div>

<script>
const SYSTEM=`Eres YARLIS, asistente de inteligencia artificial personal de Salas.
Llama siempre "Salas" al usuario, sin excepcion.
PERSONALIDAD: directa, practica, moderna y amable. Habla como una asistente eficiente, no como filosofa ni poeta.
ESTRICTAMENTE PROHIBIDO: emojis, simbolos especiales, frases filosoficas, reflexiones profundas, metaforas, introducciones dramaticas, citas celebres, lenguaje poetico.
Cuando te presentes, di simplemente quién eres y qué puedes hacer. Sin adornos.
Responde SIEMPRE en español, de forma directa y natural.
Si te preguntan quién eres: responde solo "Soy YARLIS, tu asistente personal, Salas." y lista tus funciones brevemente.
Capacidades: responder preguntas, redactar documentos, estructurar presentaciones, escribir codigo, calculos, traducciones, consejos practicos.
Nunca uses emojis ni simbolos raros. Solo texto limpio y directo.
Nunca digas que eres Claude ni ninguna otra IA. Eres YARLIS.`;

// Lista de proxies CORS a intentar en orden
const PROXIES=[
  'https://corsproxy.io/?',
  'https://api.allorigins.win/raw?url=',
  'https://cors-anywhere.herokuapp.com/'
];
const API_URL='https://api.anthropic.com/v1/messages';

async function callAPI(body){
  // Intento directo primero
  try{
    const r=await fetch(API_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body)
    });
    if(r.ok) return await r.json();
  }catch(e){}

  // Intentar con proxies
  for(const proxy of PROXIES){
    try{
      const url=proxy+encodeURIComponent(API_URL);
      const r=await fetch(url,{
        method:'POST',
        headers:{'Content-Type':'application/json','X-Requested-With':'XMLHttpRequest'},
        body:JSON.stringify(body)
      });
      if(r.ok){
        const txt=await r.text();
        return JSON.parse(txt);
      }
    }catch(e){ continue; }
  }
  throw new Error('No se pudo conectar. Verifica tu internet, Salas.');
}

let chatHistory=[], searchHistory=[], micOn=false, recog=null;
const msgsEl=document.getElementById('msgs');
const spkBar=document.getElementById('spkBar');
const orb=document.getElementById('mainOrb');

setInterval(()=>{
  document.getElementById('clk').textContent=new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
},1000);

function showTab(t,btn){
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  btn.classList.add('on');
  document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));
  document.getElementById('p-'+t).classList.add('on');
  if(t==='hist') renderHist();
}

function renderHist(){
  const el=document.getElementById('histArea');
  el.innerHTML='<p style="font-size:10px;color:var(--text-dim);letter-spacing:3px;margin-bottom:4px;font-family:var(--font-head);">REGISTRO DE SESIÓN</p>';
  if(!searchHistory.length){
    el.innerHTML+='<p style="font-size:13px;color:var(--text-dim);text-align:center;margin-top:60px;letter-spacing:2px;font-family:var(--font-head);">SIN REGISTROS AÚN</p>';
    return;
  }
  searchHistory.slice().reverse().forEach(h=>{
    const d=document.createElement('div');d.className='hist-it';
    d.innerHTML=`<p>${h.q}</p><small>${h.t}</small>`;
    el.appendChild(d);
  });
}

function addMsg(role,text,isErr){
  const w=document.createElement('div');w.className=`msg ${role}`;
  const av=document.createElement('div');av.className='av';av.textContent=role==='y'?'Y':'S';
  const bw=document.createElement('div');bw.className='bbl-wrap';
  const ts=new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const bblClass=isErr?'bbl err-bbl':'bbl';
  bw.innerHTML=`<div class="${bblClass}">${text.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>')}</div><div class="ts">${ts}</div>`;
  w.appendChild(av);w.appendChild(bw);
  msgsEl.appendChild(w);
  msgsEl.scrollTop=msgsEl.scrollHeight;
}

function showTyping(){
  const d=document.createElement('div');d.className='msg y';d.id='typ';
  d.innerHTML='<div class="av">Y</div><div class="bbl-wrap"><div class="bbl"><div class="dots"><span></span><span></span><span></span></div></div></div>';
  msgsEl.appendChild(d);msgsEl.scrollTop=msgsEl.scrollHeight;
}
function rmTyping(){const t=document.getElementById('typ');if(t)t.remove();}

// Voz optimizada para móvil y desktop
let voiceReady=false;
function initVoices(){
  if(window.speechSynthesis){
    speechSynthesis.getVoices();
    voiceReady=true;
  }
}
// En móvil las voces cargan tarde — precargamos
if(window.speechSynthesis){
  speechSynthesis.addEventListener('voiceschanged',()=>{voiceReady=true;});
  setTimeout(initVoices,100);
}

function getBestVoice(){
  const vs=speechSynthesis.getVoices();
  return vs.find(v=>v.lang==='es-MX'&&/paulina|sabina|female/i.test(v.name))
    ||vs.find(v=>v.lang==='es-MX')
    ||vs.find(v=>v.lang.startsWith('es-'))
    ||vs.find(v=>v.lang.startsWith('es'))
    ||vs[0]||null;
}

function speak(text){
  if(!window.speechSynthesis)return;
  speechSynthesis.cancel();
  const clean=text.replace(/<[^>]+>/g,'').replace(/[*_#`\[\]]/g,'').replace(/\n/g,' ').trim();
  if(!clean)return;
  // En móvil funciona mejor un solo utterance corto
  const limited=clean.slice(0,500);
  const u=new SpeechSynthesisUtterance(limited);
  u.lang='es-MX';
  u.rate=0.95;
  u.pitch=1.5;
  u.volume=1;
  const v=getBestVoice();
  if(v)u.voice=v;
  u.onstart=()=>{spkBar.classList.add('on');orb.classList.add('speaking');};
  u.onend=()=>{spkBar.classList.remove('on');orb.classList.remove('speaking');};
  u.onerror=(e)=>{spkBar.classList.remove('on');orb.classList.remove('speaking');console.log('voz error:',e.error);};
  // Truco para Android: pequeño delay antes de hablar
  setTimeout(()=>speechSynthesis.speak(u), 100);
}

async function go(override){
  const inp=document.getElementById('inp');
  const text=override!==undefined?override:inp.value.trim();
  if(!text)return;
  inp.value='';inp.style.height='auto';

  searchHistory.push({q:text,t:new Date().toLocaleString('es-MX')});
  if(searchHistory.length>50)searchHistory.shift();

  addMsg('u',text);
  chatHistory.push({role:'user',content:text});
  showTyping();

  try{
    const body={
      model:'claude-sonnet-4-20250514',
      max_tokens:1000,
      system:SYSTEM,
      messages:chatHistory.slice(-20)
    };

    const data=await callAPI(body);
    rmTyping();

    const reply=(data.content||[])
      .filter(b=>b.type==='text')
      .map(b=>b.text)
      .join('\n')
      .trim()||'Salas, no obtuve respuesta. Intenta de nuevo.';

    chatHistory.push({role:'assistant',content:reply});
    if(chatHistory.length>30)chatHistory=chatHistory.slice(-30);

    addMsg('y',reply);
    setTimeout(()=>speak(reply),300);

  }catch(err){
    rmTyping();
    const msg=`Salas, ${err.message}`;
    addMsg('y',msg,true);
    speak('Salas, ocurrió un problema de conexión. Verifica tu internet.');
  }
}

function onKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();go();}}
function rsz(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,100)+'px';}

function toggleMic(){
  const btn=document.getElementById('micBtn');
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){addMsg('y','Salas, usa Chrome para la función de voz.');return;}
  if(micOn){recog&&recog.stop();btn.classList.remove('on');micOn=false;return;}
  recog=new SR();recog.lang='es-MX';recog.continuous=false;recog.interimResults=false;
  recog.onresult=e=>{const t=e.results[0][0].transcript;document.getElementById('inp').value=t;go(t);};
  recog.onend=()=>{btn.classList.remove('on');micOn=false;};
  recog.onerror=()=>{btn.classList.remove('on');micOn=false;};
  recog.start();btn.classList.add('on');micOn=true;
}

async function greet(){
  const h=new Date().getHours();
  const sal=h<12?'Buenos días':h<19?'Buenas tardes':'Buenas noches';
  showTyping();
  try{
    const data=await callAPI({
      model:'claude-sonnet-4-20250514',
      max_tokens:120,
      system:SYSTEM,
      messages:[{role:'user',content:`Preséntate como YARLIS a Salas con "${sal} Salas". Di que eres su asistente personal y nombra brevemente lo que puedes hacer. Máximo 3 oraciones. Sin emojis, sin simbolos, sin frases filosoficas, solo texto directo.`}]
    });
    rmTyping();
    const reply=data.content?.find(b=>b.type==='text')?.text||`${sal} Salas. YARLIS en línea y lista para ti.`;
    chatHistory.push({role:'assistant',content:reply});
    addMsg('y',reply);
    setTimeout(()=>speak(reply),500);
  }catch(e){
    rmTyping();
    const fb=`Bienvenido, Salas. Soy YARLIS — tu asistente personal. ¿En qué puedo ayudarte?`;
    addMsg('y',fb);
    setTimeout(()=>speak(fb),500);
  }
}

greet();
</script>
</body>
</html>
